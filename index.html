
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>HAM IA</title>

<style>
:root {
  --bg: #070b14;
  --panel: #101827;
  --blue: #249bff;
  --cyan: #52d9ff;
  --text: #f4f8ff;
  --muted: #8493aa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% -15%, #123b65 0%, transparent 42%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
}

header {
  height: 76px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #ffffff10;
  background: #080d18dd;
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #32baff, #0750bc);
  box-shadow: 0 0 25px #168bff70;
  font-size: 22px;
  font-weight: 900;
}

.brand-name {
  font-size: 20px;
  font-weight: 850;
  letter-spacing: 2px;
}

.brand-sub {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 3px;
}

.status {
  font-size: 11px;
  color: #70e8b0;
  background: #70e8b012;
  border: 1px solid #70e8b02c;
  padding: 8px 11px;
  border-radius: 30px;
}

main {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 30px 18px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

#welcome {
  text-align: center;
  padding: 45px 10px 35px;
  margin: auto 0;
}

.orb {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  margin: 0 auto 28px;
  background:
    radial-gradient(circle at 35% 30%, #b4f4ff, #299cff 30%, #123d8b 65%, #07152f 100%);
  box-shadow:
    0 0 25px #249bff80,
    0 0 75px #168bff45,
    inset -10px -12px 25px #020b22;
  position: relative;
  animation: pulse 4s ease-in-out infinite;
}

.orb:after {
  content: "";
  position: absolute;
  inset: -12px;
  border: 1px solid #52caff50;
  border-radius: 50%;
  animation: rotate 12s linear infinite;
}

@keyframes pulse {
  50% { transform: scale(1.06); box-shadow: 0 0 40px #249bffb0, 0 0 95px #168bff60; }
}

@keyframes rotate { to { transform: rotate(360deg); } }

.eyebrow {
  color: var(--cyan);
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 800;
}

#welcome h1 {
  font-size: clamp(30px, 8vw, 45px);
  margin: 13px 0;
  letter-spacing: -1.5px;
}

#welcome h1 span {
  background: linear-gradient(90deg, #fff, #56c8ff);
  color: transparent;
  background-clip: text;
}

#welcome p {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
  max-width: 360px;
  margin: 0 auto 28px;
}

.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 500px;
  margin: auto;
}

.suggestion {
  border: 1px solid #ffffff16;
  border-radius: 15px;
  background: linear-gradient(145deg, #142237, #0c1422);
  color: #dceaff;
  padding: 14px 10px;
  text-align: left;
  font-size: 12px;
  cursor: pointer;
  transition: .2s;
}

.suggestion:active {
  border-color: var(--blue);
  transform: scale(.97);
}

.suggestion span {
  display: block;
  color: var(--cyan);
  font-size: 17px;
  margin-bottom: 7px;
}

#messages {
  display: flex;
  flex-direction: column;
  gap: 17px;
  padding-bottom: 25px;
}

.message {
  max-width: 90%;
  padding: 15px 17px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  animation: appear .25s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #167bd8, #1451a8);
  border: 1px solid #62baff50;
  border-bottom-right-radius: 5px;
  box-shadow: 0 5px 22px #0876d52a;
}

.assistant {
  align-self: flex-start;
  background: linear-gradient(145deg, #162438, #101827);
  border: 1px solid #ffffff15;
  border-bottom-left-radius: 5px;
}

.composer-wrap {
  position: sticky;
  bottom: 0;
  padding: 13px 14px calc(13px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, transparent, #070b14 20%);
}

.composer {
  max-width: 820px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border: 1px solid #2b527c;
  border-radius: 20px;
  background: #101a2a;
  box-shadow: 0 0 25px #0876d51a;
}

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  max-height: 120px;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  padding: 10px 9px;
  font: inherit;
  font-size: 15px;
}

textarea::placeholder { color: #7889a3; }

#sendButton {
  width: 45px;
  height: 45px;
  flex-shrink: 0;
  border: none;
  border-radius: 14px;
  background: linear-gradient(145deg, #43c4ff, #0870e6);
  color: white;
  font-size: 21px;
  cursor: pointer;
  box-shadow: 0 0 18px #168bff50;
}

#sendButton:disabled { opacity: .5; }

.footnote {
  text-align: center;
  color: #65748c;
  font-size: 10px;
  margin-top: 10px;
}

@media (max-width: 430px) {
  main { padding: 15px 13px; }
  #welcome { padding-top: 30px; }
  .orb { width: 94px; height: 94px; }
  .message { max-width: 94%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">H</div>
    <div>
      <div class="brand-name">HAM IA</div>
      <div class="brand-sub">INTELLIGENCE ARTIFICIELLE</div>
    </div>
  </div>
  <div class="status">● PRÊT À DISCUTER</div>
</header>

<main>
  <section id="welcome">
    <div class="orb"></div>
    <div class="eyebrow">TON ASSISTANT INTELLIGENT</div>
    <h1>Bienvenue sur <span>HAM IA</span></h1>
    <p>
      Un nouvel espace pour réfléchir, créer,
      apprendre et explorer tes idées.
      Que pouvons-nous faire aujourd'hui ?
    </p>

    <div class="suggestions">
      <button class="suggestion" type="button" data-prompt="Explique-moi quelque chose de compliqué simplement.">
        <span>✦</span>Expliquer une idée
      </button>
      <button class="suggestion" type="button" data-prompt="Aide-moi à créer un nouveau projet.">
        <span>⌘</span>Créer un projet
      </button>
      <button class="suggestion" type="button" data-prompt="Aide-moi à apprendre une nouvelle compétence.">
        <span>◈</span>Apprendre
      </button>
      <button class="suggestion" type="button" data-prompt="Donne-moi une idée originale et surprenante.">
        <span>✧</span>Explorer une idée
      </button>
    </div>
  </section>

  <div id="messages"></div>
</main>

<div class="composer-wrap">
  <form class="composer" id="chatForm">
    <textarea
      id="messageInput"
      rows="1"
      placeholder="Écris à HAM IA..."
      aria-label="Ton message"
      required
    ></textarea>
    <button id="sendButton" type="submit" aria-label="Envoyer">↑</button>
  </form>
  <div class="footnote">HAM IA peut parfois se tromper. Vérifie les informations importantes.</div>
</div>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const sendButton = document.getElementById("sendButton");

const WORKER_URL =
  "https://ham-ia-cerveau.yv574s6vcn.workers.dev";

function addMessage(text, type) {
  welcome.style.display = "none";

  const bubble = document.createElement("div");
  bubble.className = "message " + type;
  bubble.textContent = text;
  messages.appendChild(bubble);

  window.scrollTo(0, document.body.scrollHeight);
  return bubble;
}

document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => {
    input.value = button.dataset.prompt;
    input.focus();
  });
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  const text = input.value.trim();
  if (!text || sendButton.disabled) return;

  addMessage(text, "user");
  input.value = "";
  input.style.height = "auto";
  sendButton.disabled = true;

  const loading = addMessage("HAM IA réfléchit...", "assistant");

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();
    loading.remove();

    if (!response.ok || !data.reply) {
      throw new Error(data.error || "Réponse invalide");
    }

    addMessage(data.reply, "assistant");

  } catch (error) {
    loading.remove();
    addMessage(
      "Impossible de contacter HAM IA : " + error.message,
      "assistant"
    );
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
