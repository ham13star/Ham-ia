
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050814">
<title>HAM IA — Intelligence artificielle</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050814;color:#f4f7ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 min-height:100vh;overflow:hidden;
}
.app{height:100dvh;display:flex;flex-direction:column;max-width:950px;margin:auto}
header{
 padding:20px;display:flex;align-items:center;gap:13px;
 border-bottom:1px solid #172344;background:#080e20;
}
.logo{
 width:45px;height:45px;border-radius:15px;
 background:linear-gradient(135deg,#087cff,#00e5ff);
 box-shadow:0 0 25px #087cff88;
 display:grid;place-items:center;font-size:24px;font-weight:900;
}
.brand{font-size:20px;font-weight:800;letter-spacing:2px}
.status{font-size:12px;color:#52d9ff;margin-top:4px}
main{flex:1;overflow-y:auto;padding:25px 18px}
.welcome{text-align:center;margin:55px auto 35px;max-width:520px}
.brain{
 width:115px;height:115px;margin:auto auto 24px;border-radius:50%;
 display:grid;place-items:center;font-size:53px;
 background:radial-gradient(circle,#164d9c,#07152e 70%);
 border:1px solid #168cff;
 box-shadow:0 0 35px #087cff88, inset 0 0 30px #087cff55;
 animation:pulse 3s infinite;
}
@keyframes pulse{
 50%{box-shadow:0 0 55px #087cffcc,inset 0 0 40px #087cff88}
}
h1{font-size:30px;margin:0 0 12px}
.subtitle{color:#8fa4c9;line-height:1.6}
.suggestions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:25px}
.suggestions button{
 background:#101d37;border:1px solid #203d69;color:#cdeaff;
 padding:11px 14px;border-radius:20px;font-size:13px;
}
#messages{display:flex;flex-direction:column;gap:15px}
.message{
 max-width:88%;padding:14px 16px;border-radius:17px;
 line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;
}
.user{align-self:flex-end;background:linear-gradient(135deg,#0759bd,#087de8)}
.ai{align-self:flex-start;background:#101a30;border:1px solid #203553}
.error{color:#ff9a9a}
.composer{
 padding:14px 15px 20px;background:#080e20;
 border-top:1px solid #172344;
}
form{
 display:flex;gap:10px;max-width:850px;margin:auto;
 background:#101a30;border:1px solid #25436d;
 border-radius:18px;padding:8px;
}
textarea{
 flex:1;resize:none;background:transparent;border:0;outline:0;
 color:white;font:inherit;padding:12px;min-height:45px;max-height:120px;
}
textarea::placeholder{color:#7185a9}
.send{
 width:48px;border:0;border-radius:14px;
 background:linear-gradient(135deg,#087cff,#00c9ff);
 color:white;font-size:21px;font-weight:bold;
}
.send:disabled{opacity:.5}
.foot{text-align:center;color:#607493;font-size:11px;margin-top:10px}
@media(max-width:500px){
 .welcome{margin-top:35px}
 h1{font-size:26px}
 main{padding:18px 13px}
}
</style>
</head>

<body>
<div class="app">
<header>
 <div class="logo">H</div>
 <div>
  <div class="brand">HAM IA</div>
  <div class="status">● Assistant intelligent</div>
 </div>
</header>

<main id="main">
 <section class="welcome" id="welcome">
  <div class="brain">🧠</div>
  <h1>Bienvenue dans HAM IA</h1>
  <p class="subtitle">
   Votre assistant intelligent. Posez vos questions,
   explorez vos idées et donnez vie à vos projets.
  </p>
  <div class="suggestions">
   <button type="button" onclick="suggest('Explique-moi un sujet complexe simplement')">🧠 Apprendre</button>
   <button type="button" onclick="suggest('Aide-moi à créer un projet')">🚀 Créer un projet</button>
   <button type="button" onclick="suggest('Aide-moi à résoudre un problème')">💡 Résoudre un problème</button>
  </div>
 </section>
 <div id="messages"></div>
</main>

<div class="composer">
 <form id="chatForm">
  <textarea id="messageInput" placeholder="Écris ton message à HAM IA..." rows="1" required></textarea>
  <button class="send" id="sendButton" type="submit">➤</button>
 </form>
 <div class="foot">HAM IA · Futuriste Premium</div>
</div>
</div>

<script>
const WORKER_URL = "https://ham-ia-cerveau.yv574s6vcn.workers.dev";

const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const main = document.getElementById("main");
const sendButton = document.getElementById("sendButton");
const welcome = document.getElementById("welcome");

function suggest(text){
 input.value = text;
 input.focus();
}

function addMessage(text, type){
 const div = document.createElement("div");
 div.className = "message " + type;
 div.textContent = text;
 messages.appendChild(div);
 main.scrollTop = main.scrollHeight;
 return div;
}

form.addEventListener("submit", async (event)=>{
 event.preventDefault();

 const text = input.value.trim();
 if(!text || sendButton.disabled) return;

 welcome.style.display = "none";
 addMessage(text, "user");
 input.value = "";
 sendButton.disabled = true;

 const waiting = addMessage("HAM IA réfléchit...", "ai");

 try{
  const response = await fetch(WORKER_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  });

  const data = await response.json();

  if(!response.ok || !data.reply){
   throw new Error(data.error || "Le serveur n'a pas répondu correctement.");
  }

  waiting.textContent = data.reply;

 }catch(error){
  waiting.textContent = "Je rencontre un problème de connexion : " + error.message;
  waiting.classList.add("error");
 }finally{
  sendButton.disabled = false;
  input.focus();
  main.scrollTop = main.scrollHeight;
 }
});

input.addEventListener("keydown",(event)=>{
 if(event.key === "Enter" && !event.shiftKey){
  event.preventDefault();
  form.requestSubmit();
 }
});
</script>
</body>
</html>
